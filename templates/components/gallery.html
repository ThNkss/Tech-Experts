{% load site_copy %}{% if gallery %}<section class="section"><h2>{% ui 'از نزدیک ببینید' %}</h2><div class="gallery">{% for item in gallery %}<figure><a href="{{ item.asset.file.url }}"><img src="{{ item.asset.file.url }}" alt="{{ item.asset|localized:"alt_text" }}" loading="lazy"></a>{% if item|localized:"caption" %}<figcaption>{{ item|localized:"caption"|ui }}</figcaption>{% endif %}</figure>{% endfor %}</div></section>{% endif %}
